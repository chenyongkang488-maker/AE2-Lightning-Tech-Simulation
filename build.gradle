plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = providers.gradleProperty('mod_version').get()
group = 'dev.overloadsim'
base { archivesName = 'lightning-tech-simulation' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets { compatibilityFixtures { resources.srcDir 'src/gametest/resources' } }
repositories { mavenCentral() }
neoForge {
    version = providers.gradleProperty('neoForgeVersion').getOrElse('21.1.252')
    runs {
        client { client(); gameDirectory = file('run-client'); if (project.hasProperty('uiReviewWorld')) { programArguments.addAll('--quickPlaySingleplayer', project.property('uiReviewWorld').toString()) } }
        server { server(); programArgument '--nogui'; gameDirectory = file('run-server') }
        gameTestServer { type = 'gameTestServer'; gameDirectory = file('run-gametest'); systemProperty 'neoforge.enabledGameTestNamespaces', 'overload_sim' }
    }
    mods { overload_sim { sourceSet sourceSets.main; if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'runGameTestServer' }) sourceSet sourceSets.compatibilityFixtures } }
}
dependencies {
    compileOnly files('libs/Mekanism-1.21.1-10.7.19.85.jar')
    if(project.hasProperty('mekTests')) runtimeOnly files('libs/Mekanism-1.21.1-10.7.19.85.jar')
    if(project.hasProperty('cropTests')) runtimeOnly files('libs/MysticalAgriculture-1.21.1-8.0.28.jar', 'libs/Cucumber-1.21.1-8.0.16.jar')
    implementation files('libs/appliedenergistics2-19.2.17.jar', 'libs/guideme-21.1.19.jar')
    // Compile against the original supported API; exercise the same binary on newer runtimes.
    compileOnly files('libs/ae2lt-2.1.0.jar', 'libs/thunderbolt-2.0.0.jar')
    runtimeOnly files("libs/ae2lt-${providers.gradleProperty('ae2ltRuntimeVersion').getOrElse('2.1.0')}.jar",
            "libs/thunderbolt-${providers.gradleProperty('thunderboltRuntimeVersion').getOrElse('2.0.0')}.jar")
    testImplementation files('libs/ae2lt-2.1.0.jar', 'libs/thunderbolt-2.0.0.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // Use the same TOML/version-range semantics as the loader in metadata regression tests.
    testImplementation 'com.electronwill.night-config:toml:3.8.3'
    testImplementation 'org.apache.maven:maven-artifact:3.8.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('processResources') {
    inputs.property('mod_version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.version) }
    from('LICENSE') { into 'META-INF' }
    from('LICENSES.md') { into 'META-INF' }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from('art/licenses/AE2LT-LICENSE_ASSETS.md') { into 'META-INF' }
}
tasks.named('sourcesJar') {
    from(['LICENSE', 'LICENSES.md', 'THIRD_PARTY_NOTICES.md', 'art/licenses/AE2LT-LICENSE_ASSETS.md']) { into 'META-INF' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.register('verifyReleaseVersion') {
    group = 'verification'
    description = 'Reject a release tag that does not match the declared mod version.'
    doLast {
        String expected = providers.gradleProperty('releaseModVersion').getOrElse(project.version.toString())
        if (expected != project.version.toString()) {
            throw new GradleException("Release version ${expected} does not match mod_version=${project.version}")
        }
        if (!file('CHANGELOG.md').text.contains("## [${project.version}]")) {
            throw new GradleException("Missing changelog section for ${project.version}")
        }
        logger.lifecycle("Verified release version ${project.version}")
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
